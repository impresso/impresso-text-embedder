# Study A — "docs that fit in context".
#
# Research question:
# "Does forcing sub-context chunking + mean+L2 pool produce better
# doc-level embeddings than one-shot encoding the whole doc?"


extends: base.yaml

study:
  name: "A-fit"

corpus:
  ocrqa_min: 0.84
  year_min: 1930
  year_max: 1980
  min_tokens: 7000
  max_tokens: 8000
  n_per_lg: 300
  providers:
    fr: 
    de: 

scenarios:
  # 4 sizes × 3 chunkers + 1 truncate baseline = 13 scenarios.
  chunk_sizes: [512, 1024, 2048, 4096]
  chunkers: [fixed-window, token-budget]
