[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "impresso-text-embedder"
version = "0.1.0"
description = "Multilingual text embeddings for Impresso content items using Alibaba-NLP/gte-multilingual-base."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Impresso team" },
]
keywords = ["impresso", "embeddings", "sentence-transformers", "multilingual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.41",
    "impresso-essentials>=1.4.1",
    "smart-open[s3]>=7.0",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "chonkie>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
impresso-embed-create = "impresso_text_embedder.cli.create:main"
impresso-embed-validate = "impresso_text_embedder.cli.validate:main"

[project.urls]
Homepage = "https://impresso-project.ch"
Repository = "https://github.com/impresso/impresso-text-embedder"

[tool.hatch.build.targets.wheel]
packages = ["src/impresso_text_embedder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.uv]
# placeholder for future dependency-group definitions (e.g. GPU variants)
